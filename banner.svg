<svg width="100%" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#302b63;#0f0c29" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#24243e;#302b63" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#0f0c29;#24243e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bgGrad)"/>

  <circle cx="80" cy="40" r="2.5" fill="#58A6FF" opacity="0.7">
    <animate attributeName="cy" values="40;180;40" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="160" r="2" fill="#58A6FF" opacity="0.5">
    <animate attributeName="cy" values="160;30;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="50" r="3" fill="#58A6FF" opacity="0.6">
    <animate attributeName="cy" values="50;190;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="150" r="2.5" fill="#58A6FF" opacity="0.6">
    <animate attributeName="cy" values="150;20;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="25" r="2" fill="#58A6FF" opacity="0.5">
    <animate attributeName="cy" values="25;60;25" dur="5s" repeatCount="indefinite"/>
  </circle>

  <path fill="#58A6FF" opacity="0.15">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,200 Q250,180 500,200 T1000,200 V220 H0 Z;
        M0,200 Q250,220 500,200 T1000,200 V220 H0 Z;
        M0,200 Q250,180 500,200 T1000,200 V220 H0 Z"/>
  </path>

  <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    👋 Hi There, I'm Suleman
  </text>

  <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#c9d1d9">
    DevOps Engineer in the Making · Cloud &amp; Automation Enthusiast
  </text>

  <rect x="380" y="165" width="240" height="3" rx="1.5" fill="#58A6FF"/>
</svg>
